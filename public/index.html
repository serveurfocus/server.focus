<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Focus Art · Gestion de studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#6e574a;--ink2:#4a3a31;--gold:#c9a98a;--gold-d:#92683f;--bg:#ffffff;--card:#fcf9f5;--tx:#3a2d26;--mu:#8c7a6c;--ln:#e3d5c5;--ok:#6f8a62;--no:#b0654f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;display:flex}
aside{width:248px;flex:none;background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);color:#f3e9de;padding:26px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;margin:0 6px 26px}
.logo{width:42px;height:42px;border-radius:12px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font:600 24px 'Cormorant Garamond',serif;background:rgba(255,255,255,.08)}
.brand b{font:600 22px/1.05 'Cormorant Garamond',serif;letter-spacing:.02em}
.brand small{display:block;color:#d8c5b2;font-size:12px}
.menu-l{font-size:12px;color:#c9b6a3;margin:0 10px 6px}
nav button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;color:#eadccd;transition:.15s}
nav button:hover{background:rgba(255,255,255,.07)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav button.on{background:linear-gradient(90deg,#f1e0cc,#dcc2a4);color:#4a3a31;font-weight:600}
nav i{width:16px;height:16px;border-radius:5px;background:currentColor;opacity:.55;flex:none}
nav .on i{opacity:.9}
main{flex:1;min-width:0;overflow:auto;padding:30px 36px 60px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px;border-left:3px solid var(--gold);padding-left:16px}
h1{font:600 34px/1.1 'Cormorant Garamond',serif;margin:0}
.sub{color:var(--mu);font-size:14px}
.btn{font:500 14px Inter,sans-serif;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(90deg,#d9bc9e,#b8906a);border-color:transparent;color:#2f221b;font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.del{color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px}
.stat b{display:block;font:600 34px/1.1 'Cormorant Garamond',serif;color:var(--gold-d)}
.stat span{color:var(--mu);font-size:13px}
h2{font:600 22px 'Cormorant Garamond',serif;margin:0 0 12px}
.list>div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);flex-wrap:wrap}
.list>div:first-child{border-top:0}
.list small,.mu{color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-d);margin-right:4px;white-space:nowrap}
.tag.av{background:var(--ok);border-color:var(--ok);color:#fff}
.tag.na{border-color:var(--no);color:var(--no)}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.search{max-width:320px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--mu);font-size:13px;padding:4px}
.day{min-height:84px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:6px;cursor:pointer;font-size:12px;overflow:hidden}
.day:hover{border-color:var(--gold)}
.day.t{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day.o{opacity:.35}
.ev{display:block;background:var(--ink);color:#f6ece0;border-radius:6px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.av{border-left:3px solid var(--ok)}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.kan .card{background:transparent}
.kan .it{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.empty{color:var(--mu);padding:26px;text-align:center;border:1px dashed var(--ln);border-radius:14px}
dialog{border:0;border-radius:20px;padding:26px;width:min(480px,94vw);background:var(--card);color:var(--tx);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(40,28,22,.55)}
.btn.del{border-color:transparent}
dialog label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.tbl{overflow-x:auto}
body{overflow-x:hidden}
dialog{max-height:90vh;overflow:auto}
@media(max-width:820px){
body{display:block;height:auto}
aside{width:100%;padding:12px 16px;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;overflow:visible}
.brand{margin:0;gap:10px}.brand small,.menu-l,nav i{display:none}.logo{width:36px;height:36px;font-size:20px}.brand b{font-size:19px}
#st{margin:0!important;padding:0!important;text-align:right;max-width:42%}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;overflow-x:auto;background:var(--ink2);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
nav button{width:auto;flex:none;white-space:nowrap;padding:10px 14px;font-size:13px}
main{padding:20px 16px 110px}
h1{font-size:28px}
header.top{margin-bottom:18px}
header.top>.row{width:100%}
.search{max-width:none;flex:1 1 100%}
.row select{width:100%!important}
.btn{min-height:40px}.btn.sm{min-height:34px}
input,select,textarea{font-size:16px}
.grid{grid-template-columns:1fr 1fr;gap:12px}
.stat b{font-size:26px}
.cal{gap:3px}.day{min-height:54px;padding:4px;border-radius:8px}
.ev{font-size:0;width:7px;height:7px;padding:0;border-radius:50%;display:inline-block;margin:3px 2px 0 0}
.ev.av{border-left:0;background:var(--ok)}
dialog{padding:20px}
}
</style></head><body>
<aside>
 <div class="brand"><div class="logo">F</div><b>Studio<br>Focus Art<small>Gestion de studio</small></b></div>
 <div class="menu-l">Menu principal</div>
 <nav id="nav"></nav>
 <div id="st" style="margin-top:auto;font-size:12px;padding:8px 10px;color:#d8c5b2"></div>
</aside>
<main id="main"></main>
<dialog id="dlg"></dialog>
<script>
const TYPES=['Mariage','Portrait','Mode','Famille','Maternité','Produit','Événement'];
const STAGES=['Sélection','Retouche','Validation','Livré'];
const VIEWS=[['dash','Tableau de bord'],['clients','Clients'],['agenda','Agenda'],['rdv','Rendez-vous'],['trait','Traitements'],['contacts','Contacts'],['params','Paramètres']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>new Date(s+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const seed=()=>({cur:'MAD',clients:[],rdv:[],trait:[],contacts:[]});
let db=null,pw=null,tm;
try{pw=localStorage.getItem('sfa-pw')}catch(e){}
const H=()=>({'Authorization':'Bearer '+pw,'Content-Type':'application/json'});
function status(t,bad){const e=$('#st');if(e){e.textContent=t;e.style.color=bad?'#ffb3a3':'#d8c5b2'}}
function save(){clearTimeout(tm);status('Enregistrement…');tm=setTimeout(push,400)}
async function push(){try{const r=await fetch('/api/db',{method:'PUT',headers:H(),body:JSON.stringify(db)});
 if(r.status===401)return login('Mot de passe incorrect');if(!r.ok)throw 0;status('Enregistré sur le serveur ✓')}catch(e){status("Échec de l'enregistrement. Réessayez.",1)}}
async function boot(){if(!pw)return login();
 try{const r=await fetch('/api/db',{headers:H()});if(r.status===401)return login('Mot de passe incorrect');if(!r.ok)throw 0;
  const d=await r.json();if(d){db=d}else{db=seed();await push()}render();status('Connecté au serveur ✓')}
 catch(e){$('#main').innerHTML='<div class="empty">Impossible de joindre le serveur.<br><br><button class="btn" onclick="boot()">Réessayer</button></div>'}}
function login(msg){db=null;$('#main').innerHTML=`<div class="card" style="max-width:380px;margin:12vh auto"><h2>Studio Focus Art</h2><p class="mu">Entrez votre mot de passe pour ouvrir vos données.</p>
 <form onsubmit="event.preventDefault();pw=this.p.value;try{localStorage.setItem('sfa-pw',pw)}catch(e){}boot()"><input name="p" type="password" autocomplete="current-password" required autofocus>
 ${msg?`<p style="color:var(--no)">${msg}</p>`:''}<div class="row" style="margin-top:16px"><button class="btn gold">Ouvrir</button></div></form></div>`}
const cname=id=>(db.clients.find(c=>c.id===id)||{name:'—'}).name;
const money=n=>Number(n||0).toLocaleString('fr-FR')+' '+db.cur;
const tagAv=r=>r.avance>0?`<span class="tag av">Avance ${money(r.avance)}</span>`:`<span class="tag na">Sans avance</span>`;
let view='dash',month=new Date(),q='',fT='',fA='';

function nav(){$('#nav').innerHTML=VIEWS.map(([k,l])=>`<button class="${k===view?'on':''}" onclick="go('${k}')"><i></i>${l}</button>`).join('')}
function go(v){if(!db)return;view=v;render()}
function head(t,s,btn){return `<header class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="row">${btn||''}</div></header>`}
const B=(l,f)=>`<button class="btn gold" onclick="${f}">+ ${l}</button>`;

/* form dialog */
function form(title,fields,init,onSave,delK){
 const d=$('#dlg');
 d.innerHTML=`<h2>${title}</h2><form method="dialog" id="f">${fields.map(f=>{const v=init[f.k]??f.def??'';
  const el=f.t==='select'?`<select name="${f.k}">${f.o().map(([a,b])=>`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select>`
  :f.t==='area'?`<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`
  :`<input name="${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.r?'required':''}>`;
  return `<label>${f.l}</label>${el}`}).join('')}
  <div class="row" style="margin-top:22px;justify-content:flex-end">${delK&&init.id?`<button type="button" class="btn del" style="margin-right:auto" onclick="$('#dlg').close();del('${delK}','${init.id}')">Supprimer</button>`:''}<button type="button" class="btn" onclick="$('#dlg').close()">Annuler</button><button class="btn gold">Enregistrer</button></div></form>`;
 $('#f').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));onSave(o);save();d.close();render()};
 d.showModal();
}
const cOpts=()=>db.clients.map(c=>[c.id,c.name]);
const tOpts=()=>TYPES.map(t=>[t,t]);
function upsert(arr,init,o,num){const x=init.id?arr.find(a=>a.id===init.id):null;num&&num.forEach(k=>o[k]=Number(o[k]||0));if(x)Object.assign(x,o);else arr.push({id:uid(),...o})}
function del(k,id){if(confirm('Supprimer cet élément ?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}

function editClient(id,){const i=db.clients.find(c=>c.id===id)||{};
 form(id?'Modifier le client':'Nouveau client',[{k:'name',l:'Nom',r:1},{k:'phone',l:'Téléphone',t:'tel'},{k:'email',l:'Email',t:'email'},{k:'type',l:'Type de shooting',t:'select',o:tOpts},{k:'note',l:'Notes',t:'area'}],i,o=>upsert(db.clients,i,o),'clients')}
function editRdv(id,date,cl){const i=db.rdv.find(c=>c.id===id)||{date:date||addD(1),client:cl,type:(db.clients.find(c=>c.id===cl)||{}).type};
 if(!db.clients.length){alert("Ajoutez d'abord un client.");return editClient()}
 form(id?'Modifier le rendez-vous':'Nouveau rendez-vous',[{k:'client',l:'Client',t:'select',o:cOpts},{k:'date',l:'Date',t:'date',r:1},{k:'time',l:'Heure',t:'time',def:'10:00'},{k:'type',l:'Type de shooting',t:'select',o:tOpts},{k:'place',l:'Lieu'},{k:'price',l:'Prix total ('+db.cur+')',t:'number',def:0},{k:'avance',l:'Avance versée ('+db.cur+') – 0 si aucune',t:'number',def:0}],i,o=>{
  upsert(db.rdv,i,o,['price','avance'])},'rdv')}
function editTrait(id){const i=db.trait.find(c=>c.id===id)||{};
 if(!db.clients.length){alert("Ajoutez d'abord un client.");return editClient()}
 form(id?'Modifier le traitement':'Nouveau traitement',[{k:'client',l:'Client',t:'select',o:cOpts},{k:'title',l:'Travail à traiter',r:1},{k:'stage',l:'Étape',t:'select',o:()=>STAGES.map(s=>[s,s]),def:STAGES[0]}],i,o=>upsert(db.trait,i,o),'trait')}
function editContact(id){const i=db.contacts.find(c=>c.id===id)||{};
 form(id?'Modifier le contact':'Nouveau contact',[{k:'name',l:'Nom',r:1},{k:'role',l:'Rôle (maquilleuse, labo, lieu…)'},{k:'phone',l:'Téléphone',t:'tel'},{k:'email',l:'Email',t:'email'}],i,o=>upsert(db.contacts,i,o),'contacts')}
function stage(id,dir){const t=db.trait.find(x=>x.id===id);const n=STAGES.indexOf(t.stage)+dir;if(n>=0&&n<STAGES.length){t.stage=STAGES[n];save();render()}}

const rdvItem=r=>`<div><div><b>${esc(cname(r.client))}</b><br><small>${fd(r.date)} · ${r.time||''} · ${esc(r.place||'')}</small></div>
 <div class="row"><span class="tag">${esc(r.type)}</span>${tagAv(r)}<button class="btn sm" onclick="editRdv('${r.id}')">Modifier</button><button class="btn sm del" onclick="del('rdv','${r.id}')">Supprimer</button></div></div>`;

const V={
dash(){const up=db.rdv.filter(r=>r.date>=addD(0)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const av=db.rdv.reduce((s,r)=>s+r.avance,0),rest=db.rdv.reduce((s,r)=>s+Math.max(r.price-r.avance,0),0);
 return head('Tableau de bord','Vue d\'ensemble de votre studio',B('Rendez-vous',"editRdv()")+B('Client',"editClient()"))+
 `<div class="grid"><div class="card stat"><b>${up.length}</b><span>Rendez-vous à venir</span></div><div class="card stat"><b>${db.clients.length}</b><span>Clients</span></div>
 <div class="card stat"><b>${money(av)}</b><span>Avances encaissées</span></div><div class="card stat"><b>${money(rest)}</b><span>Solde restant</span></div>
 <div class="card stat"><b>${db.trait.filter(t=>t.stage!=='Livré').length}</b><span>Traitements en cours</span></div></div>
 <div class="card"><h2>Prochains rendez-vous</h2><div class="list">${up.slice(0,6).map(rdvItem).join('')||'<div class="mu">Aucun rendez-vous prévu.</div>'}</div></div>`},
clients(){const l=db.clients.filter(c=>(c.name+c.email+c.phone).toLowerCase().includes(q.toLowerCase()));
 return head('Clients',db.clients.length+' dossiers',`<input class="search" placeholder="Rechercher un client" value="${esc(q)}" oninput="q=this.value;render(true)" id="s">`+B('Client',"editClient()"))+
 (l.length?`<div class="cards">${l.map(c=>{const rs=db.rdv.filter(r=>r.client===c.id),a=rs.reduce((x,r)=>x+r.avance,0);return `<div class="card"><h2>${esc(c.name)}</h2>
  <span class="tag">${esc(c.type)}</span>${rs.length?(a?`<span class="tag av">Avance ${money(a)}</span>`:'<span class="tag na">Sans avance</span>'):''}
  <p class="mu" style="margin:10px 0">${esc(c.phone)}<br>${esc(c.email)}${c.note?'<br><i>'+esc(c.note)+'</i>':''}</p>
  <div class="row"><button class="btn sm" onclick="editRdv(0,null,'${c.id}')">+ RDV</button><button class="btn sm" onclick="editClient('${c.id}')">Modifier</button><button class="btn sm del" onclick="del('clients','${c.id}')">Supprimer</button></div></div>`}).join('')}</div>`:'<div class="empty">Aucun client trouvé.</div>')},
agenda(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
 let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);
  const ev=db.rdv.filter(r=>r.date===s).sort((a,b)=>a.time.localeCompare(b.time)).map(r=>`<span class="ev ${r.avance>0?'av':''}" onclick="event.stopPropagation();editRdv('${r.id}')">${r.time} ${esc(cname(r.client))}${r.avance>0?' · '+r.avance:''}</span>`).join('');
  cells+=`<div class="day ${d.getMonth()!==m?'o':''} ${s===addD(0)?'t':''}" onclick="editRdv(0,'${s}')"><b>${d.getDate()}</b>${ev}</div>`}
 const ml=db.rdv.filter(r=>r.date.slice(0,7)===iso(new Date(y,m,1)).slice(0,7)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return head('Agenda',month.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),`<button class="btn" onclick="month=new Date(month.getFullYear(),month.getMonth()-1,1);render()">‹</button><button class="btn" onclick="month=new Date();render()">Aujourd'hui</button><button class="btn" onclick="month=new Date(month.getFullYear(),month.getMonth()+1,1);render()">›</button>`+B('Rendez-vous',"editRdv()"))+
 `<div class="cal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div><div class="card list" style="margin-top:16px"><h2>Rendez-vous du mois</h2>${ml.map(rdvItem).join('')||'<div class="mu">Aucun rendez-vous ce mois-ci.</div>'}</div><p class="mu">Touchez un jour pour y ajouter un rendez-vous, touchez un rendez-vous pour le modifier ou le supprimer. Une barre verte indique une avance versée.</p>`},
rdv(){const l=db.rdv.filter(r=>(!fT||r.type===fT)&&(!fA||(fA==='y')===(r.avance>0))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return head('Rendez-vous',l.length+' séances',`<select style="width:auto" onchange="fT=this.value;render()"><option value="">Tous les shootings</option>${TYPES.map(t=>`<option ${t===fT?'selected':''}>${t}</option>`).join('')}</select>
 <select style="width:auto" onchange="fA=this.value;render()"><option value="">Avance : tous</option><option value="y" ${fA==='y'?'selected':''}>Avance versée</option><option value="n" ${fA==='n'?'selected':''}>Sans avance</option></select>`+B('Rendez-vous',"editRdv()"))+
 (l.length?`<div class="card list">${l.map(r=>`<div><div><b>${esc(cname(r.client))}</b><br><small>${fd(r.date)} · ${r.time} · ${esc(r.place||'')} · ${money(r.price)}</small></div>
 <div class="row"><span class="tag">${esc(r.type)}</span>${tagAv(r)}<button class="btn sm" onclick="editRdv('${r.id}')">Modifier</button><button class="btn sm del" onclick="del('rdv','${r.id}')">Supprimer</button></div></div>`).join('')}</div>`:'<div class="empty">Aucun rendez-vous pour ce filtre.</div>')},
trait(){return head('Traitements','Du tri à la livraison des photos',B('Traitement',"editTrait()"))+
 `<div class="kan">${STAGES.map(s=>`<div class="card"><h2>${s}</h2>${db.trait.filter(t=>t.stage===s).map(t=>`<div class="it"><b>${esc(t.title)}</b><br><small class="mu">${esc(cname(t.client))}</small>
 <div class="row" style="margin-top:8px"><button class="btn sm" onclick="stage('${t.id}',-1)">‹</button><button class="btn sm" onclick="stage('${t.id}',1)">›</button><button class="btn sm" onclick="editTrait('${t.id}')">Modifier</button><button class="btn sm del" onclick="del('trait','${t.id}')">×</button></div></div>`).join('')||'<div class="mu" style="margin-top:8px">Vide</div>'}</div>`).join('')}</div>`},
contacts(){return head('Contacts','Maquilleuses, laboratoires, lieux, partenaires',B('Contact',"editContact()"))+
 (db.contacts.length?`<div class="cards">${db.contacts.map(c=>`<div class="card"><h2>${esc(c.name)}</h2><span class="tag">${esc(c.role||'Contact')}</span>
 <p class="mu" style="margin:10px 0">${esc(c.phone)}<br>${esc(c.email)}</p><div class="row"><button class="btn sm" onclick="editContact('${c.id}')">Modifier</button><button class="btn sm del" onclick="del('contacts','${c.id}')">Supprimer</button></div></div>`).join('')}</div>`:'<div class="empty">Aucun contact.</div>')},
params(){return head('Paramètres','Base de données sur le serveur, sauvegarde et devise')+
 `<div class="card" style="max-width:520px"><h2>Base de données</h2><p class="mu">Vos données sont enregistrées sur votre serveur Cloudflare. Un export JSON reste utile comme copie de sécurité.</p>
 <div class="row"><button class="btn gold" onclick="exp()">Exporter (JSON)</button><label class="btn" style="margin:0">Importer<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn del" onclick="if(confirm('Tout effacer sur le serveur ?')){db=seed();save();render()}">Réinitialiser</button></div>
 <label class="mu" style="display:block;margin-top:18px">Devise</label><input value="${esc(db.cur)}" onchange="db.cur=this.value;save()" style="max-width:120px"></div>`}
};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='studio-focus-art.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{db=JSON.parse(t);save();render()}catch(e){alert('Fichier invalide.')}})}
function render(keep){nav();$('#main').innerHTML=V[view]();if(keep){const s=$('#s');if(s){s.focus();s.setSelectionRange(q.length,q.length)}}}
boot();
</script></body></html>
